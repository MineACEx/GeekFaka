services:
  - type: web
    name: geekfaka
    runtime: node
    plan: free
    region: singapore
    nodeVersion: "20"
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: chmod +x render-start.sh && ./render-start.sh
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geekfaka-db
          property: connectionString
      - key: NEXT_PUBLIC_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COUPON_API_KEY
        generateValue: true
      - key: COOKIE_NAME
        value: geekfaka_session
      - key: NODE_ENV
        value: production


databases:
  - name: geekfaka-db
    databaseName: geekfaka
    plan: free
    postgresMajorVersion: 16
